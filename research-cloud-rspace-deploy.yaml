# PASS OPTIONS LIKE: -e "rspace_home=/home/ramon/docker-april-26-ansbile rspace_url=https://myrspaceurl.com"
# When deployed via SURF ResearchCloud, rspace_url is injected automatically as the bare
# workspace FQDN (e.g. myworkspace.cloud.surf.nl) the playbook will prepend https:// if needed.
# jmelody_password, db_password and db_root_password are both auto-generated on first deploy and persisted in docker-compose.yaml.
# Docker is installed by this playbook
# The only mandatory options are rspace_url and storage_name
# storage_name must be the name of the SURF persistent volume (e.g. rspace-storage) — the mount path /data/<storage_name> is derived automatically.
# rspace_version_gh is optional. If provided, it must follow the format x.y.z (e.g. 2.1.0), without a leading 'v'.
# If omitted, the playbook will fetch the latest release from GitHub automatically.
# nextcloud_base_url is hardcoded as a var at the top of this playbook, not passed as an extra-var.
#  RSpace runs in SSO mode behind SRC-Nginx, which must come before this component in the catalog item
# (SRC-OS, SRC-CO, SRC-Nginx, SRC-External, RSpace). SRC-Nginx handles 80/443, the certificate and the SRAM login.
#  On first deploy a backdoor sysadmin is created and its credentials are printed at the end of the deployment log.
# this script uses the default server xml file in rspace docker project now on port 8080
#  rspace_auth is optional and can be "sso" (default) or "standalone". Standalone skips the SSO settings,
# the backdoor sysadmin and the SRAM login, and RSpace uses its own login (sysadmin1) behind SRC-Nginx.
---
- hosts: localhost
  become: yes
  vars:
    repo_url: "https://github.com/rspace-os/rspace-docker.git"
    storage_path: "/data/{{ storage_name }}"
    rspace_home: "/data/{{ storage_name }}/rspace-docker"
    rspace_config: "/data/{{ storage_name }}/rspace-config"
    creds_file: "/data/{{ storage_name }}/.secrets/db-creds"
    researchdrive_url_default: "researchdrive.surf.nl"
    nginx_rspace_location_conf: "/etc/nginx/app-location-conf.d/rspace.conf"  
    sso_unprotected_paths: "public|api|styles|scripts|resources|images|wopi|monitoring|ssoinfo|logout"  
    backdoor_admin_username: "rspacebackdoor"  
    backdoor_admin_email: "rspacebackdoor@{{ apache_hostname }}"  
    backdoor_admin_marker: "/data/{{ storage_name }}/.secrets/backdoor-admin-created"  
    src_nginx_session_cookie: "Authorization"

  tasks:
    
    - name: Resolve RSpace authentication mode
      set_fact:
        rspace_auth_mode: "{{ rspace_auth | default('sso', true) | trim | lower }}"

    
    - name: Validate RSpace authentication mode
      assert:
        that:
          - rspace_auth_mode in ['sso', 'standalone']
        fail_msg: "Invalid rspace_auth '{{ rspace_auth }}'. Expected sso or standalone."
        quiet: yes

    - name: Derive hostnames from rspace_url
      set_fact:
        apache_hostname: "{{ rspace_url | replace('https://', '') }}"
    
    - name: Derive ResearchDrive hostname from user input
      set_fact:
        researchdrive_hostname: >-
          {{ ('https://' ~ (
                ((researchdrive_url | default('', true) | trim) or researchdrive_url_default)
                | regex_replace('^[A-Za-z][A-Za-z0-9+.-]*://', '')
                | regex_replace('^/+', '')
             )) | urlsplit('hostname') }}

    - name: Validate resolved ResearchDrive hostname
      assert:
        that:
          - researchdrive_hostname is match('^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$')
        fail_msg: "Invalid researchdrive_url '{{ researchdrive_url | default('') }}'. Expected a hostname such as demo.data.surf.nl or https://demo.data.surf.nl/."
        quiet: yes
        

    # ------------------------------------------------------------------
    # VERIFY PERSISTENT STORAGE IS ATTACHED
    # Fails immediately with a clear message if no volume is mounted at storage_path
    # ------------------------------------------------------------------
    - name: Verify persistent storage volume is attached
      assert:
        that:
          - ansible_mounts | selectattr('mount', 'equalto', storage_path) | list | length > 0
        fail_msg: "No storage volume is mounted at {{ storage_path }}. Please attach a persistent storage volume in the ResearchCloud portal before deploying."
        quiet: yes

    # ------------------------------------------------------------------
    # DOCKER INSTALL
    # docker.io and docker-compose-v2 are available directly from the ubuntu 24.04 repos
    # ------------------------------------------------------------------
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Docker and dependencies
      apt:
        name:
          - docker.io
          - docker-compose-v2
          - jq
          - git
        state: present

    # ------------------------------------------------------------------
    # PERSISTENT STORAGE SETUP
    # ------------------------------------------------------------------
    - name: Check if Docker volumes are already on persistent storage
      stat:
        path: "{{ storage_path }}/docker-volumes"
      register: docker_volumes_dir

    - name: Ensure Docker is enabled and started
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Stop Docker to safely move volumes directory or to reapply syslink
      systemd:
        name: docker
        state: stopped

    - name: Move Docker volumes directory to persistent storage
      shell: |
        mv /var/lib/docker/volumes "{{ storage_path }}/docker-volumes"
      when: not docker_volumes_dir.stat.exists

    - name: Remove default Docker volumes directory before symlinking
      shell: |
        rm -rf /var/lib/docker/volumes

    - name: Symlink Docker volumes directory to persistent storage
      file:
        src: "{{ storage_path }}/docker-volumes"
        dest: /var/lib/docker/volumes
        state: link
        force: yes

    - name: Start Docker after volumes migration or reapply syslink
      systemd:
        name: docker
        state: started

    # ------------------------------------------------------------------
    # RSPACE DOCKER CONFIG FOLDER SETUP
    # rspace_home should be recreated on each deploy. This is to fetch
    # the latest docker compose, certs and config files. The d.p file
    # is moved to rspace_config, so that integrations and other settings
    # persist.
    # force:yes ensures that the latest gh repo is always fetched, that
    # is why d.p is moved as to not be overwritten. The db and jmelody pwds
    # are randomly generated on each deploy so will be written into
    # docker compose each time.
    #
    # The volumes so rspace-media and rspace-db are kept in different dir
    # to ensure they are not overwritten. It checks on first run and if
    # theres already volumes it doesn't move anything over, just runs
    # the syslinks.
    # ------------------------------------------------------------------
    - name: Delete the directory
      ansible.builtin.file:
        path: "{{ rspace_home }}"
        state: absent

    - name: Ensure RSpace home directory exists
      file:
        path: "{{ rspace_home }}"
        state: directory
        mode: '0755'

    - name: Clone or update RSpace Docker repo
      git:
        repo: "{{ repo_url }}"
        dest: "{{ rspace_home }}"
        version: main
        force: yes

    # ------------------------------------------------------------------
    # DEPLOYMENT.PROPERTIES
    # Kept in rspace-config on the persistent volume, separate from
    # rspace_home so it survives git clones which overwrite everything else.
    # ------------------------------------------------------------------
    - name: Ensure rspace-config directory exists on persistent storage
      file:
        path: "{{ rspace_config }}"
        state: directory
        mode: '0755'

    - name: Copy deployment.properties to persistent config on first deploy
      copy:
        src: "{{ rspace_home }}/deployment.properties"
        dest: "{{ rspace_config }}/deployment.properties"
        remote_src: yes
        force: no

    - name: Update deployment.properties bind mount in docker-compose.yaml
      replace:
        path: "{{ rspace_home }}/docker-compose.yaml"
        regexp: 'source: ./deployment.properties'
        replace: "source: {{ rspace_config }}/deployment.properties"

    # ------------------------------------------------------------------
    # Generate all the random passwords
    # ------------------------------------------------------------------
    - name: Ensure credentials directory exists
      file:
        path: "{{ creds_file | dirname }}"
        state: directory
        mode: '0700'
    
    - name: Check if credentials file already exists
      stat:
        path: "{{ creds_file }}"
      register: db_cred_file_stat
    
    - name: Generate random credentials on first deploy
      set_fact:
        db_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
        db_root_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
        javamelody_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
        backdoor_admin_password: "{{ lookup('password', '/dev/null length=12 chars=ascii_letters,digits') }}"
      when: not db_cred_file_stat.stat.exists
    
    - name: Persist generated credentials to file
      copy:
        dest: "{{ creds_file }}"
        content: |
          db_password: "{{ db_password }}"
          db_root_password: "{{ db_root_password }}"
          javamelody_password: "{{ javamelody_password }}"
          backdoor_admin_password: "{{ backdoor_admin_password }}"
        mode: '0600'
      when: not db_cred_file_stat.stat.exists
    
    - name: Load existing credentials from file
      include_vars:
        file: "{{ creds_file }}"
      when: db_cred_file_stat.stat.exists
      
    - name: Generate backdoor password if missing from older credentials file
      set_fact:
        backdoor_admin_password: "{{ lookup('password', '/dev/null length=12 chars=ascii_letters,digits') }}"
      when: backdoor_admin_password is not defined

    - name: Persist backdoor password to credentials file
      lineinfile:
        path: "{{ creds_file }}"
        regexp: '^backdoor_admin_password:'
        line: 'backdoor_admin_password: "{{ backdoor_admin_password }}"'
      no_log: true


    # ------------------------------------------------------------------
    # Replace password defaults with the just generated ones
    # ------------------------------------------------------------------
    - name: Replace MariaDB password in docker-compose.yaml
      replace:
        path: "{{ rspace_home }}/docker-compose.yaml"
        regexp: 'MARIADB_PASSWORD: rspacedocker'
        replace: "MARIADB_PASSWORD: {{ db_password }}"

    - name: Replace MariaDB root password in docker-compose.yaml
      replace:
        path: "{{ rspace_home }}/docker-compose.yaml"
        regexp: 'MARIADB_ROOT_PASSWORD: rspacedocker'
        replace: "MARIADB_ROOT_PASSWORD: {{ db_root_password }}"

    - name: Replace JDBC password in deployment.properties
      replace:
        path: "{{ rspace_config }}/deployment.properties"
        regexp: 'jdbc.password=rspacedocker'
        replace: "jdbc.password={{ db_password }}"

    - name: Set JavaMelody monitoring password in rspace.env
      lineinfile:
        path: "{{ rspace_home }}/configs/rspace.env"
        regexp: '.*javamelody\.authorized-users.*'
        line: 'CATALINA_OPTS="$CATALINA_OPTS -Djavamelody.authorized-users=rspacemonitoring:{{ javamelody_password }}"'

    # ------------------------------------------------------------------
    # Use rspace_version_gh if provided, otherwise fetch latest from GitHub.
    # ------------------------------------------------------------------
    - name: Get latest RSpace OS version from GitHub
      shell: |
        curl -s "https://api.github.com/repos/rspace-os/rspace-web/releases" \
        | jq -r '.[0].tag_name'
      register: latest_version_api
      changed_when: false
      when: rspace_version_gh is not defined or rspace_version_gh == ""

    - name: Set resolved RSpace version fact
      set_fact:
        resolved_rspace_version: "{{ rspace_version_gh if (rspace_version_gh is defined and rspace_version_gh != '') else latest_version_api.stdout }}"

    - name: Validate resolved RSpace version format
      assert:
        that:
          - resolved_rspace_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
        fail_msg: "Invalid version format '{{ resolved_rspace_version }}'. Expected format is x.y.z (e.g. 2.1.0), without a leading 'v'."
        quiet: yes

    - name: Download RSpace .war file
      get_url:
        url: "https://github.com/rspace-os/rspace-web/releases/download/{{ resolved_rspace_version }}/researchspace-{{ resolved_rspace_version }}.war"
        dest: "{{ rspace_home }}/rspace.war"
        mode: '0644'

    - name: Set hostname in deployment.properties
      replace:
        path: "{{ rspace_config }}/deployment.properties"
        regexp: 'server\.urls\.prefix=.*'
        replace: "server.urls.prefix=https://{{ rspace_url }}"

    #  Nginx proxies plain HTTP to Tomcat on loopback, so Tomcat is told the public
    # host, port and scheme to build https:// redirects and URLs.
    - name: Make the Tomcat HTTP connector aware it sits behind HTTPS
      replace:
        path: "{{ rspace_home }}/configs/server.xml"
        regexp: '<Connector port="8080"'
        replace: '<Connector port="8080" proxyName="{{ apache_hostname }}" proxyPort="443" scheme="https" secure="true"'

    - name: Expose only HTTP on localhost in docker-compose.yaml
      replace:
        path: "{{ rspace_home }}/docker-compose.yaml"
        regexp: "- '8080:8080'"
        replace: "- '127.0.0.1:8080:8080'"

    # --------------------------------------------------
    # Add custom SURF details in RSpace about page
    # --------------------------------------------------
    - name: Add SURF details to RSpace about popup
      lineinfile:
        path: "{{ rspace_config }}/deployment.properties"
        regexp: "^deployment.description="
        line: "deployment.description=This version of RSpace was installed as part of a SURF catalog item on SURF Research Cloud. More information can be found under the catalog details in Research Cloud or at https://documentation.researchspace.com/research-clouds"
        state: present

    # ------------------------------------------------------------------
    #  SSO SETTINGS IN DEPLOYMENT.PROPERTIES
    # RSpace reads the SRAM username from the OIDC_CLAIM_username header
    # set by Nginx. Name and email are filled in by the user at signup.
    # adminLogin enables /adminLogin for the backdoor sysadmin.
    # Only applied when rspace_auth_mode is sso.
    # ------------------------------------------------------------------
    - name: Set SSO properties in deployment.properties
      lineinfile:
        path: "{{ rspace_config }}/deployment.properties"
        regexp: "^{{ item.key | regex_escape }}="
        line: "{{ item.key }}={{ item.value }}"
      loop:
        - { key: 'deployment.sso.type', value: 'openid' }
        - { key: 'deployment.sso.openid.usernameClaim', value: 'OIDC_CLAIM_username' }
        - { key: 'deployment.sso.adminLogin.enabled', value: 'true' }
        - { key: 'user.signup', value: 'true' }
        - { key: 'deployment.standalone', value: 'false' }
        - { key: 'deployment.sso.backdoorUserCreation.enabled', value: 'true' }
        - { key: 'deployment.sso.logout.url', value: '/sramlogout' }
      when: rspace_auth_mode == 'sso'

    
    - name: Use RSpace's own login in standalone mode
      lineinfile:
        path: "{{ rspace_config }}/deployment.properties"
        regexp: '^deployment\.standalone='
        line: "deployment.standalone=true"
      when: rspace_auth_mode == 'standalone'

    - name: Check whether the backdoor sysadmin has already been created
      stat:
        path: "{{ backdoor_admin_marker }}"
      register: backdoor_admin_marker_stat



    # ------------------------------------------------------------------
    # RESEARCH DRIVE BRIDGE CONTAINER SETUP
    # Main config is already in docker compose, replace nextcloud url with researchdrive one
    # ------------------------------------------------------------------
    - name: Replace placeholder nextcloud url with surf one
      ansible.builtin.replace:
        path: "{{ rspace_home }}/docker-compose.yaml"
        regexp: 'https://YOUR-NEXTCLOUD.URL'
        replace: "https://{{ researchdrive_hostname }}"

    # ------------------------------------------------------------------
    # START RSPACE CONTAINERS
    # ------------------------------------------------------------------
    - name: Start containers with Docker Compose
      shell: |
        if command -v docker &>/dev/null && docker compose version &>/dev/null; then
          docker compose up -d
        else
          docker-compose up -d
        fi
      args:
        chdir: "{{ rspace_home }}"
        
    # ------------------------------------------------------------------
    # SURF RESEARCH DRIVE SETUP IN RSPACE
    # Only runs once RSpace itself reports healthy, and only inserts
    # the row if it isn't already there (for redeploys)
    # ------------------------------------------------------------------

    - name: Wait for RSpace application to report healthy status
      shell: curl -s --max-time 5 http://127.0.0.1:8080/public/status || true
      register: rspace_status
      until: "'RSpace OK' in rspace_status.stdout"
      retries: 60
      delay: 10
      changed_when: false
 
    - name: Wait for ResearchDrive bridge SSH host key to be generated
      command: "docker exec rspace-webdav-connector cat /data/keys/ssh_host_rsa_key.pub"
      register: bridge_pubkey_result
      until: bridge_pubkey_result.rc == 0
      retries: 12
      delay: 5
      changed_when: false
 
    - name: Store ResearchDrive bridge public key as a fact
      set_fact:
        researchdrive_bridge_pubkey: "{{ bridge_pubkey_result.stdout.split(' ')[1] }}"
 
    - name: Check if ResearchDrive File System already exists in RSpace database
      shell: >
        docker compose -f {{ rspace_home }}/docker-compose.yaml exec -T rspace-db
        mariadb -urspacedocker -p{{ db_password }} rspace -N -e
        "SELECT COUNT(*) FROM NfsFileSystem WHERE url='rspace-webdav-connector:2022';"
      register: nfs_filesystem_count
      changed_when: false
    
    - name: Update existing ResearchDrive File System in RSpace database
      shell: >
        docker compose -f {{ rspace_home }}/docker-compose.yaml exec -T rspace-db
        mariadb -urspacedocker -p{{ db_password }} rspace -e
        "UPDATE NfsFileSystem SET authType='PASSWORD', clientType='SFTP', disabled='', name='SURF Research Drive - {{ researchdrive_hostname }}', authOptions='', clientOptions='SFTP_SERVER_PUBLIC_KEY={{ researchdrive_bridge_pubkey }}'
        WHERE url='rspace-webdav-connector:2022';"
      when: nfs_filesystem_count.stdout | trim != "0"
    
    - name: Insert ResearchDrive File System into RSpace database
      shell: >
        docker compose -f {{ rspace_home }}/docker-compose.yaml exec -T rspace-db
        mariadb -urspacedocker -p{{ db_password }} rspace -e
        "INSERT INTO NfsFileSystem (authType, clientType, disabled, name, url, authOptions, clientOptions, readAllowlist, writeAllowlist)
        VALUES ('PASSWORD', 'SFTP', '', 'SURF Research Drive - {{ researchdrive_hostname }}', 'rspace-webdav-connector:2022', '', 'SFTP_SERVER_PUBLIC_KEY={{ researchdrive_bridge_pubkey }}', NULL, NULL);"
      when: nfs_filesystem_count.stdout | trim == "0"

    # ------------------------------------------------------------------
    #  BACKDOOR SYSADMIN (first deploy only)
    # The account is inserted straight into the database only if sso enabled and the account hasn't been made before
    # ------------------------------------------------------------------
    - name: Create the backdoor sysadmin
      when: rspace_auth_mode == 'sso' and not backdoor_admin_marker_stat.stat.exists
      block:
        - name: Check whether the backdoor account already exists
          shell: >
            docker compose -f {{ rspace_home }}/docker-compose.yaml exec -T rspace-db
            mariadb -urspacedocker -p{{ db_password }} rspace -N -e
            "SELECT COUNT(*) FROM User WHERE username='{{ backdoor_admin_username }}';"
          register: backdoor_user_count
          changed_when: false

        - name: Insert the backdoor sysadmin into the RSpace database
          shell: >
            docker compose -f {{ rspace_home }}/docker-compose.yaml exec -T rspace-db
            mariadb -urspacedocker -p{{ db_password }} rspace -e
            "START TRANSACTION;
            SET @id = GREATEST(
              COALESCE((SELECT next_val FROM hibernate_sequences WHERE sequence_name='AbstractUserOrGroupImpl'), 1),
              (SELECT COALESCE(MAX(id), 0) + 1 FROM User),
              (SELECT COALESCE(MAX(id), 0) + 1 FROM rsGroup));
            INSERT INTO User (id, version, account_expired, account_locked, contentInitialized, credentials_expired,
              email, account_enabled, first_name, last_name, numConsecutiveLoginFailures, password, salt, username,
              tempAccount, signupSource, creationDate, affiliation, allowedPiRole)
            VALUES (@id, 0, b'0', b'0', b'0', b'0',
              '{{ backdoor_admin_email }}', b'1', 'RSpace', 'Backdoor Admin', 0, '{{ backdoor_admin_password | hash('sha256') }}', NULL, '{{ backdoor_admin_username }}',
              b'0', 'SSO_BACKDOOR', NOW(), 'SURF ResearchCloud', b'0');
            INSERT INTO user_role (user_id, role_id) SELECT @id, id FROM roles WHERE name='ROLE_SYSADMIN';
            UPDATE hibernate_sequences SET next_val = @id + 1 WHERE sequence_name='AbstractUserOrGroupImpl';
            INSERT INTO hibernate_sequences (sequence_name, next_val)
              SELECT 'AbstractUserOrGroupImpl', @id + 1 FROM DUAL
              WHERE NOT EXISTS (SELECT 1 FROM hibernate_sequences WHERE sequence_name='AbstractUserOrGroupImpl');
            COMMIT;"
          when: backdoor_user_count.stdout | trim == "0"

        - name: Record that the backdoor sysadmin exists
          copy:
            dest: "{{ backdoor_admin_marker }}"
            content: "{{ backdoor_admin_username }}\n"
            mode: '0600'

    # ------------------------------------------------------------------
    #  NGINX LOCATION
    # SRC-Nginx includes authentication.conf in its HTTPS server block (see
    # SURF's "Web Apps via Nginx" demo). The RSpace locations are kept
    # between BEGIN/END RSPACE markers, so a redeploy replaces the block
    # instead of appending a second copy.
    # Paths in sso_unprotected_paths (public pages, static files, API,
    # WOPI, JavaMelody, logout) skips the SRAM login. Everything else goes
    # through SURF's auth_request /validate check, and the SRAM username
    # is passed to RSpace in the OIDC_CLAIM_username header.
    # ------------------------------------------------------------------
    - name: Deploy RSpace Nginx location for SURF SRAM login
      blockinfile:
        path: "{{ nginx_rspace_location_conf }}"
        marker: "# {mark} RSPACE"
        block: |
          location = /sramlogout {
              add_header Set-Cookie "{{ src_nginx_session_cookie }}=; Path=/; Max-Age=0; Secure; HttpOnly" always;
              return 302 /public/ssologout;
          }

          location ~ ^/({{ sso_unprotected_paths }})(/|$) {
              proxy_pass http://127.0.0.1:8080;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto https;
              proxy_read_timeout 300s;
              client_max_body_size 0;
              proxy_cookie_flags ~ secure samesite=none;
              add_header Strict-Transport-Security "max-age=31536000" always;
          }

          location / {
              error_page 401 = @custom_401;
              auth_request /validate;
              auth_request_set $username $upstream_http_username;
              proxy_set_header OIDC_CLAIM_username $username;
              proxy_pass http://127.0.0.1:8080;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto https;
              proxy_read_timeout 300s;
              client_max_body_size 0;
              proxy_cookie_flags ~ secure samesite=none;
              add_header Strict-Transport-Security "max-age=31536000" always;
          }
      when: rspace_auth_mode == 'sso'

    #  standalone mode, no SRAM login, everything is proxied to RSpace
    - name: Deploy RSpace Nginx location for standalone login
      blockinfile:
        path: "{{ nginx_rspace_location_conf }}"
        marker: "# {mark} RSPACE"
        block: |
          location / {
              proxy_pass http://127.0.0.1:8080;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto https;
              proxy_read_timeout 300s;
              client_max_body_size 0;
              proxy_cookie_flags ~ secure samesite=none;
              add_header Strict-Transport-Security "max-age=31536000" always;
          }
      when: rspace_auth_mode == 'standalone'

    - name: Validate Nginx configuration
      command: nginx -t
      changed_when: false

    - name: Reload Nginx
      systemd:
        name: nginx
        state: reloaded

    # ------------------------------------------------------------------
    #  BACKDOOR SYSADMIN CREDENTIALS
    # Printed last so they are easy to find in the deployment log.
    # ------------------------------------------------------------------
    - name: Show the backdoor sysadmin credentials
      debug:
        msg:
          - "1. Log in to https://{{ apache_hostname }} with your SURF SRAM account."
          - "2. Open https://{{ apache_hostname }}/adminLogin and log in with:"
          - "   Username: {{ backdoor_admin_username }}"
          - "   Password: {{ backdoor_admin_password }}"
      when: rspace_auth_mode == 'sso' and not backdoor_admin_marker_stat.stat.exists
